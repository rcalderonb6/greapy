site_name: GREApy
site_description: A simple python-based implementation of the General Relativistic Entropic Acceleration (GREA) theory
site_author: rcalderonb6
site_url: https://rcalderonb6.github.io/greapy
repo_url: https://github.com/rcalderonb6/greapy

copyright: "Copyright &copy; 2025 Rodrigo Calderón"

extra_css:
  - stylesheets/notebook.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/notebook-math.js

theme:
    palette:
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/toggle-switch
              name: Switch to light mode
            #   name: Switch to dark mode
        - scheme: default
            # primary: blue
            # accent: indigo
          toggle:
              icon: material/toggle-switch-off-outline
            #   name: Switch to light mode
              name: Switch to dark mode


    
    name: material
    icon:
        repo: fontawesome/brands/github
    logo: assets/logo.png
    favicon: assets/favicon.ico
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.top
        - search.highlight
        - search.share
    custom_dir: "docs/overrides"
    font:
        text: Google Sans
        code: Regular

plugins:
    - search
    - marimo
    - mkdocstrings
    - git-revision-date
    - git-revision-date-localized:
          enable_creation_date: true
          type: timeago
    # - pdf-export
    - mkdocs-jupyter:
          enable_md_extensions: true
          include_source: True
          ignore_h1_titles: True
          execute: True
          allow_errors: false
          ignore: ["_playground.py","test.py","conf.py"]
          execute_ignore: ["Sampling with Cobaya.ipynb","*ignore.ipynb"]
          remove_tag_config:
              remove_input_tags:
                  - hide-input
                  - imports
              remove_all_outputs_tags:
                  - hide-output
              remove_cell_tags:
                  - hide-cell
          # Alternative: Hide all input cells by default
          # show_input: False
          # Alternative: Custom CSS classes for hiding
          # kernel_name: python3

markdown_extensions:
    - admonition    
    - pymdownx.superfences
    - pymdownx.details
    - abbr
    - attr_list
    - def_list
    - footnotes
    - meta
    - md_in_html
    - pymdownx.highlight:
        linenums: true
    - pymdownx.arithmatex:
        inline_syntax: ['$', '$']
        generic: true
    - pymdownx.smartsymbols
    - toc:
        permalink: true

# extra:
#     analytics:
#         provider: google
#         property: UA-XXXXXXXXX-X

nav:
    - Home: index.md
    - Installation: installation.md
    - Usage: usage.md
    - Playground: playground.md
    - Tutorials:
        - examples/First Steps.ipynb
        - examples/Sampling with Cobaya.ipynb
    - API Reference:
          - GREA module: grea.md
          - Cobaya module: cobaya.md
    - Report Issues: https://github.com/rcalderonb6/greapy/issues
    # - Contributing: contributing.md
    # - FAQ: faq.md
    # - Changelog: changelog.md
