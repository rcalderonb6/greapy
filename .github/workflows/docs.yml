name: docs
on:
    push:
        branches:
            - main
            - master
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: 🚀 Install uv
              uses: astral-sh/setup-uv@v4
            
            - name: 🐍 Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: 3.10

            - name: Install dependencies
              run: |
                  uv python -m pip install --upgrade pip
                  uv pip install --user --no-cache-dir Cython
                  uv pip install --user -r requirements.txt -r requirements_dev.txt
            - name: Discover typos with codespell
              run: |
                  codespell --skip="*.csv,*.geojson,*.json,*.js,*.html,*cff,*.ipynb,./.git" --ignore-words-list="aci,hist"
            - name: PKG-TEST
              run: |
                  python -m unittest discover tests/
            - run: mkdocs gh-deploy --force

