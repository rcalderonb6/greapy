name: Deploy to Notebook to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

    #   - name: 📦 Install dependencies
    #     run: |
    #       uv pip install marimo

      - name: 🛠️ Export notebooks
        run: |
          uvx marimo export html-wasm --sandbox --mode run --no-show-code docs/test.py -o _nb

