name: docs-build
on:
    pull_request:
        branches:
            - main
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 🚀 Install uv
              uses: astral-sh/setup-uv@v4
            
            - name: 🐍 Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: 3.10.8

            # - name: Install GDAL
            #   run: |
            #       python -m pip install --upgrade pip
            #       pip install --find-links=https://girder.github.io/large_image_wheels --no-cache GDAL pyproj
            # - name: Test GDAL installation
            #   run: |
            #       python -c "from osgeo import gdal"
            #       gdalinfo --version

            # - name: Install dependencies
            #   run: |
            #       pip install --no-cache-dir Cython
            #       pip install -r requirements.txt -r requirements_dev.txt
            #       pip install .

            - name: 📦 Install dependencies
              run: |
                uv pip install --no-cache-dir Cython
                uv pip install -r requirements.txt -r requirements_dev.txt
            
            - name: Discover typos with codespell
              run: codespell --skip="*.csv,*.geojson,*.json,*.js,*.html,*cff,*.pdf,*.ipynb,./.git" --ignore-words-list="aci,acount,hist"
            - name: PKG-TEST
              run: |
                  python -m unittest discover tests/
            - name: Build docs
              run: |
                  mkdocs build

