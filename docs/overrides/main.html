{% extends "base.html" %}

{% block extrahead %}
<!-- MathJax Configuration -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["\\(", "\\)"], ["$", "$"]],
      displayMath: [["\\[", "\\]"], ["$$", "$$"]],
      processEscapes: true,
      processEnvironments: true,
      packages: ['base', 'ams', 'noerrors', 'noundefined', 'colorv2']
    },
    options: {
      ignoreHtmlClass: ".*|",
      processHtmlClass: "arithmatex|math"
    },
    svg: {
      fontCache: 'global'
    },
    startup: {
      ready: function() {
        MathJax.startup.defaultReady();
        console.log("MathJax initialized for notebooks");
      }
    }
  };
</script>
<!-- Load MathJax -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{{ super() }}
{% endblock extrahead %}

{% block content %}
{% if page.nb_url %}
    <a href="{{ page.nb_url }}" title="Download Notebook" class="md-content__button md-icon">
        {% include ".icons/material/download.svg" %}
    </a>
{% endif %}

{{ super() }}
{% endblock content %}
